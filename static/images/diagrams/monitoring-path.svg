<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Monitoring foundation: browser, Grafana and Prometheus</title>
  <desc id="desc">A browser connects to the Docker host's loopback port 3000, using an SSH tunnel if remote. Grafana queries Prometheus through the Compose network at prometheus:9090. Prometheus scrapes its own localhost:9090 metrics endpoint. Only these two services are included.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker></defs>
  <rect width="1000" height="800" rx="20" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="48" font-size="28" font-weight="700">Follow one query from browser to data</text>
    <rect x="290" y="80" width="420" height="90" rx="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="500" y="116" font-size="24" font-weight="700">Browser / administration client</text>
    <text x="500" y="147" font-size="19">Local access, or an SSH port forward</text>
    <rect x="60" y="240" width="880" height="510" rx="20" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="276" font-size="22" font-weight="700">Docker host — Compose network</text>
    <path d="M500 172 V318" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="255" y="190" width="490" height="34" rx="8" fill="#f8fafc"/>
    <text x="500" y="214" font-size="20">Host loopback: 127.0.0.1:3000</text>
    <rect x="260" y="330" width="480" height="90" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="367" font-size="25" font-weight="700">Grafana</text>
    <text x="500" y="398" font-size="20">Queries its configured Prometheus source</text>
    <path d="M500 422 V508" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="465" font-size="20" text-anchor="end" dx="-18">HTTP query</text>
    <text x="500" y="492" font-size="19" text-anchor="end" dx="-18">prometheus:9090</text>
    <rect x="260" y="520" width="480" height="100" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="560" font-size="25" font-weight="700">Prometheus</text>
    <text x="500" y="594" font-size="20">Scrapes and stores its own metrics</text>
    <path d="M742 550 H830 V670 H500 V622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="710" font-size="19">Self-scrape target: localhost:9090 → /metrics</text>
    <text x="500" y="781" font-size="18">Exporters, Loki, Alloy and alert delivery are separate extensions.</text>
  </g>
</svg>
