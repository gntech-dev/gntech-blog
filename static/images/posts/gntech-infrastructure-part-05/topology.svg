<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Scoped home-to-Hetzner WireGuard routing</title><desc id="d">A home server subnet connects through an encrypted routed WireGuard tunnel to a Hetzner workload subnet. Management networks remain outside the tunnel.</desc><defs><linearGradient id="b"><stop stop-color="#071426"/><stop offset="1" stop-color="#15344f"/></linearGradient><linearGradient id="l"><stop stop-color="#34d5ff"/><stop offset="1" stop-color="#ffad52"/></linearGradient></defs><rect width="1200" height="520" rx="20" fill="url(#b)"/><g font-family="Arial,sans-serif" fill="#f2f7fc"><text x="55" y="58" font-size="28" font-weight="bold">Home-to-Hetzner site-to-site routing</text><text x="57" y="88" font-size="16" fill="#b5c8d9">WireGuard Layer 3 · explicit routes · least-privilege scope</text><rect x="55" y="130" width="330" height="310" rx="18" fill="#10243a" stroke="#49cfff"/><text x="80" y="170" font-size="20" font-weight="bold">HOME SITE</text><rect x="92" y="195" width="255" height="68" rx="10" fill="#173952" stroke="#49cfff"/><text x="219" y="224" text-anchor="middle" font-size="19" font-weight="bold">Home Router</text><text x="219" y="248" text-anchor="middle" font-size="14">WireGuard · 10.255.5.2/30</text><rect x="80" y="298" width="180" height="74" rx="9" fill="#1a3549" stroke="#6f8b9e"/><text x="170" y="328" text-anchor="middle" font-size="16" font-weight="bold">Server VLAN</text><text x="170" y="354" text-anchor="middle" font-size="15">10.10.20.0/24</text><rect x="273" y="298" width="92" height="74" rx="9" fill="#26303d" stroke="#777"/><text x="319" y="328" text-anchor="middle" font-size="14">Mgmt</text><text x="319" y="352" text-anchor="middle" font-size="13">excluded</text><rect x="815" y="130" width="330" height="310" rx="18" fill="#10243a" stroke="#ffad52"/><text x="840" y="170" font-size="20" font-weight="bold">HETZNER SITE</text><rect x="852" y="195" width="255" height="68" rx="10" fill="#3b3027" stroke="#ffad52"/><text x="979" y="224" text-anchor="middle" font-size="19" font-weight="bold">Selected CHR</text><text x="979" y="248" text-anchor="middle" font-size="14">WireGuard · 10.255.5.1/30</text><rect x="840" y="298" width="180" height="74" rx="9" fill="#263746" stroke="#6f8b9e"/><text x="930" y="328" text-anchor="middle" font-size="16" font-weight="bold">Workload LAN</text><text x="930" y="354" text-anchor="middle" font-size="15">10.12.0.0/24</text><rect x="1033" y="298" width="92" height="74" rx="9" fill="#26303d" stroke="#777"/><text x="1079" y="328" text-anchor="middle" font-size="14">PVE Mgmt</text><text x="1079" y="352" text-anchor="middle" font-size="13">excluded</text><path d="M385 220 C500 120 700 120 815 220" fill="none" stroke="url(#l)" stroke-width="10" stroke-linecap="round"/><text x="600" y="145" text-anchor="middle" font-size="18" font-weight="bold">WireGuard · UDP 51820</text><text x="600" y="176" text-anchor="middle" font-size="14" fill="#b9d7e9">10.255.5.0/30 · encrypted routed traffic</text><path d="M260 335H273M1020 335h13" stroke="#ff7676" stroke-width="3" stroke-dasharray="7 6"/><text x="600" y="480" text-anchor="middle" font-size="15" fill="#b6c8d8">Only the listed subnets are routed; no default route or Layer 2 bridge is created.</text></g></svg>