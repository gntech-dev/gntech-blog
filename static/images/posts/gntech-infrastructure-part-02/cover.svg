<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Hetzner Proxmox foundation architecture</title><desc id="desc">A Hetzner provider WAN connects to Proxmox host vmbr0. An independent rescue and console path protects management. Three isolated host-only bridges serve future CHR-A, CHR-B, and a private VM LAN.</desc><rect width="1200" height="630" fill="#101827"/><text x="65" y="74" fill="#f5f8ff" font-family="sans-serif" font-size="40" font-weight="700">GNTECH Infrastructure · Part 02</text><text x="65" y="113" fill="#b7c9df" font-family="sans-serif" font-size="23">Hetzner Proxmox foundation · Recoverability first</text><rect x="65" y="190" width="235" height="110" rx="18" fill="#244160" stroke="#78c3ff" stroke-width="3"/><text x="182" y="235" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="27">Hetzner WAN</text><text x="182" y="272" text-anchor="middle" fill="#bfe0ff" font-family="sans-serif" font-size="19">Provider uplink</text><path d="M300 244 H390" stroke="#78c3ff" stroke-width="6"/><rect x="390" y="180" width="295" height="137" rx="20" fill="#27566b" stroke="#65ddce" stroke-width="3"/><text x="537" y="222" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="27">Proxmox VE</text><text x="537" y="259" text-anchor="middle" fill="#c1f8ee" font-family="sans-serif" font-size="20">vmbr0 · Host WAN</text><text x="537" y="289" text-anchor="middle" fill="#d3e2ed" font-family="sans-serif" font-size="18">ZFS · VM storage</text><path d="M685 216 H755 V179 H813 M685 248 H813 M537 317 V399 H813" stroke="#9cb6d8" stroke-width="5" fill="none"/><rect x="813" y="139" width="330" height="88" rx="16" fill="#2b4173" stroke="#a4c5ff" stroke-width="3"/><text x="978" y="173" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">Future CHR-A</text><text x="978" y="203" text-anchor="middle" fill="#d8e5ff" font-family="sans-serif" font-size="18">vmbr1 · 10.255.1.1/30</text><rect x="813" y="243" width="330" height="88" rx="16" fill="#2b4173" stroke="#a4c5ff" stroke-width="3"/><text x="978" y="277" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">Future CHR-B</text><text x="978" y="307" text-anchor="middle" fill="#d8e5ff" font-family="sans-serif" font-size="18">vmbr2 · 10.255.2.1/30</text><rect x="813" y="357" width="330" height="88" rx="16" fill="#27574e" stroke="#85deb5" stroke-width="3"/><text x="978" y="391" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">Private VM LAN</text><text x="978" y="421" text-anchor="middle" fill="#dcf9e9" font-family="sans-serif" font-size="18">vmbr3 · 10.3.0.1/24</text><rect x="65" y="373" width="510" height="104" rx="16" fill="#4a3c2c" stroke="#f3c87c" stroke-width="3"/><text x="320" y="412" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="24">Independent rescue / console</text><text x="320" y="449" text-anchor="middle" fill="#ffe6b4" font-family="sans-serif" font-size="20">Works even when CHR guests fail</text><path d="M575 415 H652 V317" stroke="#f3c87c" stroke-width="5" stroke-dasharray="10 8" fill="none"/><text x="65" y="558" fill="#c3d0e2" font-family="sans-serif" font-size="20">No CHR WAN routing, VM NAT, or forwarding policy assumed at this stage</text><text x="65" y="596" fill="#95abc6" font-family="sans-serif" font-size="17">Conceptual topology · Example addresses · No live deployment implied</text></svg>