<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Proxmox VM3 firewall policy routing diagram</title><desc id="d">Private VM LAN vmbr3 can reach the WAN with IPv4 outbound NAT and receive established replies. Unsolicited WAN inbound, VM3 to CHR-A/CHR-B transit and all VM3 IPv6 forwarding are blocked by the example supplemental policy.</desc><rect width="1200" height="600" fill="#0e1726"/><text x="62" y="65" font-family="sans-serif" font-size="34" fill="#fff" font-weight="bold">Part 04 · Explicit traffic boundaries</text><rect x="65" y="125" width="290" height="120" rx="17" fill="#183f50" stroke="#43d9e8" stroke-width="3"/><text x="210" y="172" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="27">VM LAN · vmbr3</text><text x="210" y="209" text-anchor="middle" fill="#b4f2ee" font-family="sans-serif" font-size="19">10.3.0.0/24</text><rect x="480" y="125" width="290" height="120" rx="17" fill="#243455" stroke="#81abed" stroke-width="3"/><text x="625" y="171" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="27">Proxmox host</text><text x="625" y="207" text-anchor="middle" fill="#c7d8ff" font-family="sans-serif" font-size="19">FORWARD + NAT</text><rect x="890" y="125" width="245" height="120" rx="17" fill="#20483c" stroke="#6bdba2" stroke-width="3"/><text x="1012" y="171" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="27">WAN · vmbr0</text><text x="1012" y="207" text-anchor="middle" fill="#c5f6da" font-family="sans-serif" font-size="19">IPv4 Internet</text><path d="M355 168 H480 M770 168 H890" stroke="#5cde9e" stroke-width="7"/><path d="M887 195 H774 M477 195 H359" stroke="#5cde9e" stroke-width="5" stroke-dasharray="12 9"/><text x="625" y="284" text-anchor="middle" fill="#8bebba" font-family="sans-serif" font-size="20">Allowed outbound + established replies</text><rect x="480" y="345" width="290" height="95" rx="15" fill="#273151" stroke="#b79ce9" stroke-width="3"/><text x="625" y="381" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="24">CHR-A / CHR-B</text><text x="625" y="412" text-anchor="middle" fill="#dbc9ff" font-family="sans-serif" font-size="17">Separate transit networks</text><path d="M210 245 V395 H475" stroke="#f5a08d" stroke-width="5" stroke-dasharray="9 8" fill="none"/><path d="M435 380 L463 409 M463 380 L435 409" stroke="#ff8c81" stroke-width="7"/><text x="267" y="375" font-family="sans-serif" font-size="17" fill="#ffb1a7">Blocked from VM3</text><rect x="65" y="476" width="1060" height="72" rx="12" fill="#1a2840"/><text x="595" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#dae6f7">IPv6 on vmbr3: blocked until independently routed, filtered and validated</text></svg>