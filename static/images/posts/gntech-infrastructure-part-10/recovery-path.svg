<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-labelledby="title">
  <title id="title">Proxmox backup and recovery across two sites</title>
  <rect width="860" height="290" rx="16" fill="#0d1929"/>
  <g fill="#162b40" stroke="#7294b7" stroke-width="2">
    <rect x="35" y="25" width="320" height="240" rx="12"/>
    <rect x="505" y="25" width="320" height="240" rx="12"/>
  </g>
  <g fill="#254766" stroke="#79bae7" stroke-width="2">
    <rect x="90" y="79" width="210" height="45" rx="8"/>
    <rect x="90" y="193" width="210" height="45" rx="8"/>
    <rect x="560" y="79" width="210" height="45" rx="8"/>
    <rect x="560" y="193" width="210" height="45" rx="8"/>
  </g>
  <g fill="#eaf5ff" font-family="sans-serif" font-size="16" text-anchor="middle">
