<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Active Directory and DNS lab discovery</title><desc id="desc">Lab clients query two internal DNS servers for Active Directory SRV records and locate either domain controller. The controllers replicate directory-integrated DNS data.</desc><defs><linearGradient id="bg"><stop stop-color="#071426"/><stop offset="1" stop-color="#15344f"/></linearGradient><linearGradient id="link"><stop stop-color="#37cfff"/><stop offset="1" stop-color="#ffb65d"/></linearGradient></defs><rect width="1200" height="520" rx="20" fill="url(#bg)"/><g font-family="Arial,sans-serif" fill="#f2f7fc"><text x="55" y="58" font-size="28" font-weight="bold">AD DS depends on internal DNS</text><text x="57" y="88" font-size="16" fill="#b5c8d9">SRV lookup → domain controller discovery → authenticated services</text><rect x="55" y="165" width="250" height="225" rx="18" fill="#10243a" stroke="#49cfff"/><text x="180" y="205" text-anchor="middle" font-size="20" font-weight="bold">LAB CLIENT</text><rect x="88" y="240" width="184" height="95" rx="12" fill="#173952" stroke="#49cfff"/><text x="180" y="275" text-anchor="middle" font-size="17" font-weight="bold">DNS query</text><text x="180" y="305" text-anchor="middle" font-size="15">_ldap / _kerberos SRV</text><text x="180" y="365" text-anchor="middle" font-size="14" fill="#b8c9d8">DNS: DC01 + DC02</text><rect x="480" y="125" width="285" height="285" rx="18" fill="#10243a" stroke="#8da5bc"/><text x="622" y="165" text-anchor="middle" font-size="20" font-weight="bold">AD-INTEGRATED DNS</text><rect x="520" y="198" width="205" height="70" rx="10" fill="#1b3348" stroke="#8da5bc"/><text x="622" y="228" text-anchor="middle" font-size="16" font-weight="bold">corp.example.test</text><text x="622" y="250" text-anchor="middle" font-size="14">A · SRV · _msdcs records</text><rect x="520" y="295" width="205" height="70" rx="10" fill="#1b3348" stroke="#8da5bc"/><text x="622" y="325" text-anchor="middle" font-size="16" font-weight="bold">Secure updates</text><text x="622" y="347" text-anchor="middle" font-size="14">Replicated through AD DS</text><rect x="895" y="120" width="250" height="125" rx="16" fill="#173952" stroke="#49cfff"/><text x="1020" y="158" text-anchor="middle" font-size="18" font-weight="bold">DC01 · 10.20.0.10</text><text x="1020" y="187" text-anchor="middle" font-size="15">Writable DC · DNS · GC</text><text x="1020" y="215" text-anchor="middle" font-size="14" fill="#b8c9d8">First forest controller</text><rect x="895" y="285" width="250" height="125" rx="16" fill="#3a3027" stroke="#ffb65d"/><text x="1020" y="323" text-anchor="middle" font-size="18" font-weight="bold">DC02 · 10.20.0.11</text><text x="1020" y="352" text-anchor="middle" font-size="15">Writable DC · DNS · GC</text><text x="1020" y="380" text-anchor="middle" font-size="14" fill="#d7c6b1">Second controller</text><path d="M305 282H480M765 225H895M765 330H895" fill="none" stroke="url(#link)" stroke-width="7" stroke-linecap="round"/><path d="M1020 245V285" fill="none" stroke="#d7e6f2" stroke-width="4" stroke-dasharray="8 6"/><text x="600" y="475" text-anchor="middle" font-size="15" fill="#b6c8d8">Example-only lab namespace and addresses · not a production GNTECH topology</text></g></svg>