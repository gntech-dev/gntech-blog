<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Hybrid GNTECH infrastructure architecture</title><desc id="d">Home Proxmox and MikroTik network on the left, Hetzner Proxmox with two CHR routers on the right, connected by a planned secured link, with identity, backup, monitoring and Zero Trust management services below.</desc><rect width="1200" height="630" fill="#101827"/><text x="55" y="70" fill="#f5f8ff" font-family="sans-serif" font-size="38" font-weight="700">GNTECH Infrastructure · Part 01</text><text x="55" y="108" fill="#b5c8df" font-family="sans-serif" font-size="20">Hybrid architecture · Trust boundaries before deployment</text><rect x="55" y="150" width="460" height="270" rx="22" fill="#1b304b" stroke="#75c5ff" stroke-width="3"/><rect x="685" y="150" width="460" height="270" rx="22" fill="#1b304b" stroke="#6cddbd" stroke-width="3"/><text x="85" y="194" fill="#fff" font-family="sans-serif" font-size="28">HOME SITE</text><text x="715" y="194" fill="#fff" font-family="sans-serif" font-size="28">HETZNER SITE</text><rect x="88" y="220" width="394" height="65" rx="12" fill="#2d5275"/><text x="285" y="260" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22">MikroTik edge · VLAN zones</text><rect x="88" y="309" width="394" height="65" rx="12" fill="#2d5275"/><text x="285" y="348" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22">Home Proxmox · Workloads</text><rect x="718" y="220" width="394" height="65" rx="12" fill="#285b57"/><text x="915" y="260" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22">Proxmox · Host WAN / LAN</text><rect x="718" y="309" width="188" height="65" rx="12" fill="#285b57"/><rect x="924" y="309" width="188" height="65" rx="12" fill="#285b57"/><text x="812" y="348" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22">CHR-A</text><text x="1018" y="348" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22">CHR-B</text><path d="M515 255 H685" stroke="#f3c978" stroke-width="5" stroke-dasharray="12 9"/><text x="600" y="238" text-anchor="middle" fill="#f3d99b" font-family="sans-serif" font-size="17">Planned VPN</text><rect x="55" y="468" width="1090" height="100" rx="18" fill="#26324c" stroke="#667b9c" stroke-width="2"/><text x="600" y="502" text-anchor="middle" fill="#e7f1ff" font-family="sans-serif" font-size="23">Cross-cutting services and recovery</text><text x="600" y="540" text-anchor="middle" fill="#c4d4e7" font-family="sans-serif" font-size="20">Identity / DNS   ·   Zero Trust access   ·   Backups   ·   Monitoring   ·   Rescue console</text><text x="55" y="604" fill="#a9bad0" font-family="sans-serif" font-size="16">Conceptual diagram · No live deployment status implied</text></svg>