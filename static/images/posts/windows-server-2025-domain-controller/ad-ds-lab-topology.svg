<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Windows Server 2025 Domain Controller Lab Topology</title>
  <desc id="desc">Diagram showing a Windows Server 2025 domain controller providing Active Directory and DNS to Windows clients on a homelab LAN.</desc>
  <rect width="1200" height="675" fill="#0b1220"/>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="60" y="70" fill="#e5e7eb" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">Windows Server 2025 Domain Controller</text>
  <text x="60" y="108" fill="#93c5fd" font-family="Inter,Segoe UI,Arial" font-size="20">AD DS + DNS + SYSVOL verification topology</text>

  <rect x="70" y="185" width="290" height="180" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="230" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="700">DC01</text>
  <text x="105" y="264" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial" font-size="18">Windows Server 2025</text>
  <text x="105" y="300" fill="#d1d5db" font-family="Inter,Segoe UI,Arial" font-size="17">IP: 10.0.20.10/24</text>
  <text x="105" y="330" fill="#d1d5db" font-family="Inter,Segoe UI,Arial" font-size="17">Roles: AD DS, DNS, GC</text>

  <rect x="455" y="160" width="290" height="115" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="205" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="23" font-weight="700">DNS Namespace</text>
  <text x="490" y="240" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial" font-size="18">corp.gntech.local</text>

  <rect x="455" y="350" width="290" height="125" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="398" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="23" font-weight="700">LAN / VLAN</text>
  <text x="490" y="432" fill="#fde68a" font-family="Inter,Segoe UI,Arial" font-size="18">10.0.20.0/24</text>

  <rect x="840" y="170" width="285" height="130" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="220" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="23" font-weight="700">Windows Clients</text>
  <text x="875" y="255" fill="#ddd6fe" font-family="Inter,Segoe UI,Arial" font-size="17">DNS → 10.0.20.10</text>

  <rect x="840" y="375" width="285" height="130" rx="18" fill="#111827" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="425" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="23" font-weight="700">Verification</text>
  <text x="875" y="460" fill="#fecaca" font-family="Inter,Segoe UI,Arial" font-size="17">dcdiag · repadmin · nltest</text>

  <line x1="360" y1="275" x2="455" y2="218" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="360" y1="275" x2="455" y2="413" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="745" y1="218" x2="840" y2="235" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <line x1="745" y1="413" x2="840" y2="440" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <text x="60" y="610" fill="#64748b" font-family="Inter,Segoe UI,Arial" font-size="16">Use static IP, domain DNS, clean time sync, AD DS validation, DNS checks, SYSVOL/NETLOGON checks, and client join testing.</text>
</svg>
