<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 326" role="img" aria-labelledby="title">
  <title id="title">Heartbeat and independent warning paths</title>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L8 4.5L0 9Z" fill="#405b77"/>
    </marker>
  </defs>
  <rect width="620" height="326" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#142a40">
    <rect x="20" y="20" width="580" height="112" rx="12" fill="#e0edfa"/>
    <text x="40" y="49" font-size="20" font-weight="700">Monitored host</text>
    <text x="40" y="99" font-size="22">Prometheus</text>
    <text x="407" y="99" font-size="22">Alertmanager</text>
    <rect x="20" y="196" width="580" height="110" rx="12" fill="#e5f2e8"/>
    <text x="40" y="225" font-size="20" font-weight="700">Outside the monitored host</text>
    <text x="40" y="276" font-size="22">Test inbox</text>
    <text x="407" y="276" font-size="22">Healthchecks.io</text>
    <g fill="none" stroke="#405b77" stroke-width="2" marker-end="url(#arrow)">
      <path d="M179 94H388"/>
      <path d="M478 109V247"/>
      <path d="M387 270H168"/>
    </g>
    <text x="207" y="82" font-size="16">Synthetic alert</text>
    <text x="359" y="170" font-size="16">HTTPS ping</text>
    <text x="185" y="257" font-size="16">Warning on silence</text>
  </g>
</svg>
