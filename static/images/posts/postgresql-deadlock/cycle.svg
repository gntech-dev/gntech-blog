<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Two-row deadlock before PostgreSQL aborts a transaction</title>
<desc id="desc">Session A holds account row 1 and requests row 2. Session B holds row 2 and requests row 1. Blue arrows indicate held rows; red dashed arrows indicate waiting requests.</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1864ab"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c92a2a"/></marker></defs>
<rect width="1000" height="500" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#102a43">
<text x="500" y="42" font-size="25" font-weight="bold">Two transactions, opposite row order</text>
<rect x="75" y="95" width="280" height="85" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="215" y="145" font-size="23">Session A</text>
<rect x="645" y="95" width="280" height="85" rx="12" fill="#fff" stroke="#526d82" stroke-width="2"/>
<text x="785" y="145" font-size="23">Account row 1</text>
<rect x="75" y="320" width="280" height="85" rx="12" fill="#fff" stroke="#526d82" stroke-width="2"/>
<text x="215" y="370" font-size="23">Account row 2</text>
<rect x="645" y="320" width="280" height="85" rx="12" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="785" y="370" font-size="23">Session B</text>
<path d="M365 137H630" stroke="#1864ab" stroke-width="3" marker-end="url(#blue)"/>
<text x="500" y="119" font-size="19" fill="#1864ab">holds</text>
<path d="M635 362H370" stroke="#1864ab" stroke-width="3" marker-end="url(#blue)"/>
<text x="500" y="395" font-size="19" fill="#1864ab">holds</text>
<path d="M215 190V305" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#red)"/>
<text x="325" y="253" font-size="19" fill="#c92a2a">waits for</text>
<path d="M785 310V195" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#red)"/>
<text x="675" y="253" font-size="19" fill="#c92a2a">waits for</text>
<text x="500" y="461" font-size="18">One transaction must abort to release the circular dependency.</text>
</g></svg>
