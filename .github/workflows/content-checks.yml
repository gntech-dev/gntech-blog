name: Blog publishing checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and audit blog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUGO_VERSION: '0.147.0'
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BASE: ${{ github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metadata parser
        run: python -m pip install PyYAML==6.0.3

      - name: Install matching Hugo extended release
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          install_dir="$RUNNER_TEMP/hugo"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          curl --fail --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" -o checksums.txt
          awk -v file="$archive" '$2 == file { print; found = 1 } END { if (!found) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" hugo
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Test publication guard
        run: python -m unittest discover -s tools -p test_publication.py -v

      - name: Check changed article publication and covers
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
            if [ "$PR_DRAFT" = true ]; then args+=(--allow-drafts); fi
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BASE"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          python tools/check-publication.py --base "$base" "${args[@]}"
          git diff --check "$base" HEAD

      - name: Build production site and audit links and examples
        run: |
          hugo --destination public --printPathWarnings
          python tools/audit-content.py --site public

      - name: Build drafts and audit their links too
        run: |
          hugo --buildDrafts --destination public-drafts --printPathWarnings
          python tools/audit-content.py --site public-drafts
