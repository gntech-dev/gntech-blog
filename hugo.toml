baseURL = "https://blog.gntech.me"
title = "GnTech Blog"
theme = "PaperMod"
languageCode = "en-us"
enableInlineShortcodes = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  description = "Homelab, networking, automation, and infrastructure tinkering"
  author = "GnTech"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowSearchButton = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false

  [params.homeInfoParams]
    Title = "GnTech Blog"
    Content = "Proxmox, MikroTik, Docker, Linux, and the occasional rabbit hole. Written by a homelab gremlin."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/gntech-dev"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.gntech.me/index.xml"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = true

  [params.label]
    text = "GnTech Blog"
    icon = ""
    iconHeight = 35

[languages]
  [languages.en]
    languageName = "English"
    weight = 1

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10

      [[languages.en.menu.main]]
        identifier = "projects"
        name = "Projects"
        url = "/projects/"
        weight = 20

      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/archives/"
        weight = 30

      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    style = "monokai"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.rss]
    limit = 20
