baseURL = "https://blog.gntech.me"
title = "GnTech Blog"
theme = "PaperMod"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true
enableRobotsTXT = true
buildFuture = true

[pagination]
  pagerSize = 10

[params]
  description = "Homelab, networking, automation, and infrastructure tinkering"
  author = "GnTech"

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowSearchButton = true
  comments = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false

  [params.homeInfoParams]
    Title = "GnTech Blog"
    Content = "Proxmox, MikroTik, Docker, Linux, and the occasional rabbit hole. Written by a homelab gremlin."

  [params.analytics]
    [params.analytics.google]
      SiteVerificationTag = "_PS-pexL-9ALRje-eQz9Mx8Q81_8_TNtVaIuIH4AFfs"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/gntech-dev"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.gntech.me/index.xml"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = true

  [params.label]
    text = "GnTech Blog"
    icon = ""
    iconHeight = 35

[languages]
  [languages.en]
    contentDir = "content"
    languageName = "English"
    languageCode = "en-us"
    weight = 1

    [languages.en.params]
      description = "Homelab, networking, automation, and infrastructure tinkering"
      [languages.en.params.homeInfoParams]
        Title = "GnTech Blog"
        Content = "Proxmox, MikroTik, Docker, Linux, and the occasional rabbit hole. Written by a homelab gremlin."

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10

      [[languages.en.menu.main]]
        identifier = "projects"
        name = "Projects"
        url = "/projects/"
        weight = 20

      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/archives/"
        weight = 30

      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 40

  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    languageCode = "es"
    weight = 2

    [languages.es.params]
      description = "Homelab, redes, automatización e infraestructura"
      [languages.es.params.homeInfoParams]
        Title = "GnTech Blog"
        Content = "Proxmox, MikroTik, Docker, Linux y algún que otro agujero de conejo. Escrito por un gremlin del homelab."

    [languages.es.menu]
      [[languages.es.menu.main]]
        identifier = "about"
        name = "Acerca de"
        url = "/es/about/"
        weight = 10

      [[languages.es.menu.main]]
        identifier = "projects"
        name = "Proyectos"
        url = "/es/projects/"
        weight = 20

      [[languages.es.menu.main]]
        identifier = "archives"
        name = "Archivos"
        url = "/es/archives/"
        weight = 30

      [[languages.es.menu.main]]
        identifier = "search"
        name = "Buscar"
        url = "/es/search/"
        weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    style = "monokai"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.rss]
    limit = 20
